name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The tests run against the live API, so a nightly run is also a monitor:
    # if the published contract moves, this is where it shows up first.
    - cron: "23 5 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
